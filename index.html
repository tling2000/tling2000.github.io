<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Temporarily Unavailable</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f6f7f8;
      color: #202124;
    }

    main {
      width: min(34rem, calc(100% - 3rem));
      text-align: center;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 600;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: #5f6368;
      font-size: 1rem;
      line-height: 1.6;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #17181a;
        color: #f1f3f4;
      }

      p {
        color: #bdc1c6;
      }
    }
  </style>
</head>
<body>
  <main aria-labelledby="status-title">
    <h1 id="status-title">Temporarily unavailable</h1>
    <p>This site is currently offline.</p>
  </main>
</body>
</html>
